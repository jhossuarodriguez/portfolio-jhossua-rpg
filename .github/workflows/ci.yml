name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Tipos, lint, tests y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm build

  e2e:
    name: E2E (TesterArmy)
    needs: calidad
    runs-on: ubuntu-latest
    env:
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec e2e-web install chromium --with-deps
      - run: pnpm test:e2e
      - name: Tests con agente (solo si hay clave del gateway)
        if: ${{ env.AI_GATEWAY_API_KEY != '' }}
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: pnpm test:e2e:agent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: .e2e/
          if-no-files-found: ignore
